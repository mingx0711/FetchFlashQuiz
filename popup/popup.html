<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Flashcards</title>
  <link rel="stylesheet" href="../libs/semantic.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-surface: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --border-focus: #6366f1;

      --primary: #8b899f;
      --primary-hover: #3730a3;
      --primary-light: #e0e7ff;

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --secondary-bg: #f1f5f9;
      --secondary-border: #cbd5e1;
      --secondary-hover: #e2e8f0;

      --success-color: #15803d;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 28px -4px rgba(15, 23, 42, 0.12);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --max-width: 820px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100vh;
      background: var(--bg-surface);
      width: 280px;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-surface);
      color: var(--text-main);
      margin: 0;
      padding: 14px 12px 20px 12px;
      width: 280px;
      box-sizing: border-box;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }

    body::-webkit-scrollbar-track {
      background: transparent;
    }

    body::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    body::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .app-container {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ui.center.aligned.basic.segment {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      text-align: left !important;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .ui.header {
      font-family: 'Source Serif 4', Georgia, serif !important;
      font-size: 1.8rem !important;
      letter-spacing: -0.01em;
      margin: 0 !important;
      font-weight: 600 !important;
      color: var(--text-main) !important;
      display: flex;
      align-items: center;
    }

    #addVocabForm {
      background: var(--card-bg) !important;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow-sm) !important;
      padding: 16px 14px !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
      box-sizing: border-box !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #addVocabForm:focus-within {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md) !important;
    }

    /* Row Layouts: Grouping fields naturally */
    .form-row {
      display: grid;
      gap: 10px;
      width: 100%;
    }

    .form-row.two-cols {
      grid-template-columns: 1fr 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .ui.input,
    .ui.field {
      width: 100% !important;
      margin-bottom: 0 !important;
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    label,
    .ui.input label {
      font-size: 0.72rem !important;
      font-weight: 600 !important;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted) !important;
      margin-bottom: 4px !important;
      display: block;
    }

    .ui.input input,
    .ui.input select,
    .ui.field input,
    select.ui.search.dropdown {
      font-family: inherit !important;
      font-size: 0.88rem !important;
      padding: 8px 10px !important;
      border-radius: var(--radius-sm) !important;
      border: 1px solid var(--secondary-border) !important;
      background: #ffffff !important;
      color: var(--text-main) !important;
      width: 100% !important;
      box-sizing: border-box !important;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    .ui.input input:focus,
    .ui.input select:focus,
    .ui.field input:focus,
    select.ui.search.dropdown:focus {
      border-color: var(--border-focus) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
    }

    .ui.input input::placeholder {
      color: var(--text-subtle);
    }

    select.ui.search.dropdown {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3a64748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
      background-repeat: no-repeat !important;
      background-position: right 8px center !important;
      background-size: 14px !important;
      padding-right: 28px !important;
    }

    #addVocabForm button.ui.button[type="submit"],
    #addVocabForm button.ui.button.primary {
      font-family: inherit !important;
      font-size: 0.9rem !important;
      font-weight: 600 !important;
      border-radius: var(--radius-sm) !important;
      background: var(--primary) !important;
      border: 1px solid var(--primary) !important;
      color: #ffffff !important;
      padding: 10px 16px !important;
      transition: all 0.15s ease !important;
      margin-top: 4px !important;
      cursor: pointer;
      width: 100%;
    }

    #addVocabForm button.ui.button[type="submit"]:hover,
    #addVocabForm button.ui.button.primary:hover {
      background: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
      box-shadow: var(--shadow-sm);
    }

    #addBookButton {
      font-family: inherit !important;
      font-size: 0.82rem !important;
      font-weight: 600 !important;
      border-radius: var(--radius-sm) !important;
      background: var(--secondary-bg) !important;
      border: 1px solid var(--secondary-border) !important;
      color: var(--text-main) !important;
      padding: 8px 12px !important;
      transition: all 0.15s ease !important;
      cursor: pointer;
      width: 100%;
    }

    #addBookButton:hover {
      background: var(--secondary-hover) !important;
    }

    #newBookField {
      display: none;
      margin-top: 2px;
      background-color: var(--bg-surface);
      border: 1px dashed var(--secondary-border);
      border-radius: var(--radius-sm);
      padding: 10px;
      width: 100%;
    }

    #newBookField input {
      margin-bottom: 8px;
    }

    /* Dynamic Search Results Container */
    .ui.container {
      border: 1px solid var(--secondary-border) !important;
      border-radius: var(--radius-md) !important;
      background: var(--bg-surface) !important;
      margin-top: 8px !important;
      padding: 14px !important;
      width: 100% !important;
      max-width: 100% !important;
      text-align: left !important;
    }

    #vocabInfoInfs,
    #vocabInfo {
      margin-left: 0 !important;
      margin-bottom: 8px !important;
      text-align: left !important;
      font-size: 0.88rem !important;
      color: var(--text-main) !important;
      line-height: 1.5;
    }

    #addAuto {
      display: inline-block;
      flex: 1;
      background: #869d96 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: var(--radius-sm) !important;
      padding: 9px 14px !important;
      font-weight: 600 !important;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #getGoogleMeaning {
      display: inline-block;
      flex: 0.3;
      background: #8f9db9 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: var(--radius-sm) !important;
      padding: 9px 14px !important;
      font-size: 0.6rem;
      cursor: pointer;
      transition: background 0.15s ease;
      width: 60vw;
      font-weight: 300;
    }

    #getGoogleMeaning:hover {
      background: #678ffb !important;
    }

    #getGoogleMeaning[hidden] {
      display: none !important;
    }

    .vocab-actions {
      display: flex;
      gap: 8px;
    }

    #addAuto:hover {
      background: #047857 !important;
    }

    /* Status Notifications & Primary Nav Buttons */
    #message {
      margin: 0;
      color: var(--success-color) !important;
      font-weight: 600 !important;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      border-radius: var(--radius-md) !important;
      padding: 10px 14px !important;
      text-align: center !important;
      font-size: 0.85rem;
    }

    #message:empty {
      display: none;
    }

    #manageButton {
      display: block !important;
      width: 100% !important;
      font-family: inherit !important;
      font-size: 0.88rem !important;
      font-weight: 600 !important;
      border-radius: var(--radius-md) !important;
      background: #ffffff !important;
      border: 1px solid var(--card-border) !important;
      color: var(--text-main) !important;
      box-shadow: var(--shadow-sm) !important;
      transition: all 0.15s ease !important;
      padding: 10px 14px !important;
      cursor: pointer;
      text-align: center;
    }

    #manageButton:hover {
      background: var(--bg-surface) !important;
      border-color: var(--secondary-border) !important;
    }

    .quickstart-container {
      display: none;
      position: relative;
      text-align: left;
      padding: 16px 18px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--card-border);
      margin-bottom: 8px;
      animation: slideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #closeQuickStart {
      position: absolute;
      top: 12px;
      right: 12px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    #closeQuickStart:hover {
      background: var(--secondary-bg);
      color: var(--text-main);
      border-color: var(--secondary-border);
    }

    .quickstart-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 1.15rem;
      color: var(--text-main);
      margin: 0 0 4px 0;
    }

    .quickstart-desc {
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .quickstart-decks {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .deck-group {
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .deck-label {
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .deck-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .deck-buttons .ui.button {
      font-family: inherit !important;
      font-size: 0.8rem !important;
      font-weight: 500 !important;
      background: #ffffff !important;
      border: 1px solid var(--secondary-border) !important;
      color: var(--text-main) !important;
      border-radius: var(--radius-sm) !important;
      padding: 5px 10px !important;
      margin: 0 !important;
      transition: all 0.15s ease !important;
      cursor: pointer;
    }

    .deck-buttons .ui.button:hover {
      background: var(--primary-light) !important;
      border-color: var(--primary) !important;
      color: var(--primary) !important;
    }

    .quickstart-message {
      margin: 6px 0;
      color: var(--success-color);
      font-weight: 600;
      min-height: 18px;
      font-size: 0.82rem;
    }

    .footer-tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 10px 12px;
      padding: 10px 14px;
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
    }

    .footer-tools-grid button,
    .footer-tools-grid a {
      font-family: inherit !important;
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      text-decoration: none !important;
      font-weight: 500 !important;
      transition: color 0.15s ease !important;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: none;
      padding: 0;
    }

    .footer-tools-grid button:hover,
    .footer-tools-grid a:hover {
      color: var(--primary) !important;
    }

    #autoSearchModeControl {
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      color: var(--text-muted) !important;
      font-size: 0.8rem !important;
      font-weight: 500 !important;
      cursor: pointer;
    }

    #autoSearchModeControl input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    #googleApiKeyPanel {
      display: none;
      margin-top: 8px;
      padding: 14px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      background: #ffffff;
      box-shadow: var(--shadow-md);
      text-align: left;
    }

    #googleApiKeyPanel label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.35;
      margin-bottom: 8px;
      text-transform: none;
      letter-spacing: normal;
    }

    #googleApiKeyPanel input {
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0 10px 0;
    }

    #googleApiKeyPanel .ui.button {
      margin-right: 6px !important;
      font-family: inherit !important;
      font-weight: 600 !important;
      font-size: 0.8rem !important;
      padding: 6px 12px !important;
      border-radius: var(--radius-sm) !important;
      cursor: pointer;
    }

    #saveGoogleApiKey {
      background: var(--primary) !important;
      color: #ffffff !important;
      border: 1px solid var(--primary) !important;
    }

    #clearGoogleApiKey {
      background: var(--secondary-bg) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--secondary-border) !important;
    }

    #googleApiKeyStatus {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    #addVocabForm.auto-search .manual-search-field {
      display: none !important;
    }

    @media (max-width: 680px) {
      body {
        padding: 12px 10px 18px 10px;
      }

      .form-row.two-cols {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      #addVocabForm {
        padding: 14px 12px !important;
      }

      .footer-tools-grid {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">

    <div id="quickstart" class="quickstart-container">
      <button id="closeQuickStart" title="Close import panel">&#10006;</button>
      <h2 class="quickstart-title">Quick Import Vocab Decks</h2>
      <p class="quickstart-desc">Click any deck below to instantly add it to your vocabulary list.</p>
      <div id="quickstartMessage" class="quickstart-message"></div>

      <div class="quickstart-decks">
        <div class="deck-group">
          <div class="deck-label">German</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="German/A1-B2">A1~B2 with full etymologies and usages</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">Japanese</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="Japanese/N1">N1</button>
            <button class="ui button" data-deck="Japanese/N2">N2</button>
            <button class="ui button" data-deck="Japanese/N3">N3</button>
            <button class="ui button" data-deck="Japanese/N4">N4</button>
            <button class="ui button" data-deck="Japanese/N5">N5</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">Chinese</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="Chinese/hsk1-2">HSK1-2</button>
            <button class="ui button" data-deck="Chinese/hsk3">HSK3</button>
            <button class="ui button" data-deck="Chinese/hsk41">HSK4</button>
            <button class="ui button" data-deck="Chinese/hsk51">HSK5</button>
            <button class="ui button" data-deck="Chinese/hsk61">HSK6</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">English (in Chinese)</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="English/kaoyan">kaoyan</button>
            <button class="ui button" data-deck="English/CET4">CET4</button>
            <button class="ui button" data-deck="English/CET6">CET6</button>
            <button class="ui button" data-deck="English/SAT_CN">SAT</button>
            <button class="ui button" data-deck="English/GRE_CN">GRE</button>
            <button class="ui button" data-deck="English/GMAT_CN">GMAT</button>
            <button class="ui button" data-deck="English/IELTS_CN">IELTS</button>
            <button class="ui button" data-deck="English/TOEFL_CN">TOEFL</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">English</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="English/TOEFL_en">TOEFL</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">French</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="French/A1">AQA</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">Latin</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="Latin/Latin">Latin</button>
          </div>
        </div>

        <div class="deck-group">
          <div class="deck-label">Italian</div>
          <div class="deck-buttons">
            <button class="ui button" data-deck="Italian/A1">A1</button>
          </div>
        </div>
      </div>
    </div>

    <div class="ui center aligned basic segment">
      <div class="page-header">
        <h1 class="ui header">Quick lookup</h1>
      </div>
    </div>

    <form class="ui center aligned basic segment" id="addVocabForm">

      <!-- Row 1: Word (Own Row) -->
      <div class="form-group">
        <label for="word">Word</label>
        <div class="ui input">
          <input type="text" id="word" placeholder="Enter word to lookup or save..." required />
        </div>
      </div>

      <!-- Row 2: Definition (Own Row) -->
      <div class="form-group manual-search-field">
        <label for="definition">Definition</label>
        <div class="ui input">
          <input type="text" id="definition" placeholder="Definition (leave empty to auto search)" />
        </div>
      </div>

      <!-- Row 3: Pronunciation & Gender (Same Row) -->
      <div class="form-row two-cols manual-search-field">
        <div class="form-group">
          <label for="pronounciation">Pronunciation</label>
          <div class="ui input">
            <input type="text" id="pronounciation" placeholder="Pronunciation (optional)" />
          </div>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <div class="ui input">
            <select class="ui search dropdown" id="gender">
              <option value="">Gender (optional)</option>
              <option value="neuter">Neuter</option>
              <option value="common">Common</option>
              <option value="feminine">Feminine</option>
              <option value="masculine">Masculine</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Row 4: Collection & Language (Same Row) -->
      <div class="form-row two-cols">
        <div class="form-group">
          <label for="bookSelector">Collection</label>
          <div class="ui input">
            <select class="ui search dropdown" id="bookSelector">
              <option value="default">Default Deck</option>
              <option value="new">+ Add new collection...</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="selectLanguage">Auto Query Language</label>
          <div class="ui input">
            <select class="ui search dropdown" id="selectLanguage">
              <option value="latin">Latin</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="fr">French</option>
              <option value="nl">Dutch</option>
              <option value="es">Spanish</option>
              <option value="pt">Portuguese</option>
              <option value="ja">Japanese (beta)</option>
              <option value="zh">Chinese (beta)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Expandable New Collection Input -->
      <div class="ui field" id="newBookField">
        <label for="newBook">New Collection Name</label>
        <input type="text" id="newBook" placeholder="e.g. Italian Chapter 1">
        <button class="ui button" id="addBookButton" type="button">Add collection</button>
      </div>

      <!-- Submit Action Button -->
      <button class="ui button primary" type="submit">Add Word</button>

      <!-- Search Results Box -->
      <div id="vocabInfoInfInfs" class="ui container" style="display: none;">
        <div id="vocabInfoInfs"></div>
        <div id="vocabInfo"></div>
        <div class="vocab-actions">
          <button class="ui button" id="getGoogleMeaning" type="button" hidden>Get meaning from Google instead</button>
          <button class="ui button" id="addAuto" type="button">Add to database</button>
        </div>
      </div>

      <button style="display:none" class="ui button" id="addAutoFallback" type="button">Add to database</button>
    </form>

    <div id="message"></div>
    <button class="ui button" id="manageButton">Manage Vocabularies</button>

    <div class="footer-tools-grid">
      <button id="showQuickStart" type="button">Easy import decks</button>

      <a href="https://mingx0711.github.io/" target="_blank" rel="noopener noreferrer">About this project</a>

      <button id="googleApiKeyButton" type="button">Add Google Translate API Key</button>

      <label id="autoSearchModeControl" title="Recommended after setting up a Google Translate API Key">
        <input type="checkbox" id="autoSearchMode">
        Auto search mode
      </label>
    </div>

    <div id="googleApiKeyPanel">
      <label for="googleApiKeyInput">
        Add your Google Translation API Key to enable automatic lookup with Google Translate API. The Key is saved
        locally in your browser.
      </label>
      <input class="ui input" type="password" id="googleApiKeyInput" autocomplete="off" placeholder="Enter API Key...">
      <div>
        <button class="ui button" id="saveGoogleApiKey" type="button">Save key</button>
        <button class="ui button" id="clearGoogleApiKey" type="button">Clear key</button>
      </div>
      <div id="googleApiKeyStatus" role="status"></div>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
